<!-- ============================================================
     HTSM 产品编码管理系统 · 共享应用框架（Project Shell）
     使用方式：叶子页面将本片段嵌入 <body>，并替换两个 SLOT：
       <!-- SLOT: pageTitle -->     页面标题
       <!-- SLOT: mainContent -->   页面主体内容
     图标：Lucide <i data-lucide="...">（leaf 页面已引入 lucide 脚本）
     颜色体系：colors_and_type.css（CSS 变量前缀 htsm）
     ============================================================ -->

<style id="critical-layout">
  /* ---------- 基础盒模型（无 Tailwind 编译亦可稳定渲染） ---------- */
  .app-shell *,
  .app-shell *::before,
  .app-shell *::after {
    box-sizing: border-box;
  }

  /* ---------- 应用框架骨架 ---------- */
  .app-shell { display: flex; min-height: 100vh; background: var(--htsm-bg); }
  .app-sidebar {
    width: 240px;
    flex-shrink: 0;
    background: var(--htsm-sidebar);
    color: var(--htsm-sidebar-ink);
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
  }
  .app-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .app-topbar {
    height: 64px;
    flex-shrink: 0;
    background: var(--htsm-surface);
    border-bottom: 1px solid var(--htsm-line);
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 40;
  }
  .app-content { flex: 1; padding: 24px; }

  /* ---------- 侧边栏 · 品牌区 ---------- */
  .sidebar-brand { display: flex; align-items: center; gap: 12px; padding: 20px 18px 16px; }
  .sidebar-brand-logo {
    width: 32px;
    height: 32px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--htsm-r-md);
    background: linear-gradient(135deg, var(--htsm-primary), var(--htsm-brand-grad-to));
    color: var(--htsm-primary-ink);
  }
  .sidebar-brand-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .sidebar-brand-title {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.3;
    letter-spacing: 0.02em;
    color: var(--htsm-sidebar-active-ink);
    white-space: nowrap;
  }
  .sidebar-brand-sub {
    font-size: 11px;
    line-height: 1.3;
    letter-spacing: 0.08em;
    color: var(--htsm-sidebar-ink-2);
    white-space: nowrap;
  }

  /* ---------- 侧边栏 · 导航分组 ---------- */
  .sidebar-nav { flex: 1; overflow-y: auto; padding: 4px 10px 12px; }
  .sidebar-nav-group-label {
    font-size: 11px;
    line-height: 1.3;
    letter-spacing: 0.06em;
    color: var(--htsm-sidebar-ink-2);
    padding: 12px 14px 6px;
  }
  .sidebar-nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-radius: var(--htsm-r-md);
    color: var(--htsm-sidebar-ink);
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    transition: background-color .15s, color .15s;
  }
  .sidebar-nav-item:hover { background: var(--htsm-sidebar-hover); color: var(--htsm-sidebar-active-ink); }
  [data-active="true"] { background: var(--htsm-primary); color: var(--htsm-sidebar-active-ink); }

  /* ---------- 侧边栏 · 底部用户区 ---------- */
  .sidebar-user {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    border-top: 1px solid var(--htsm-sidebar-line);
  }
  .sidebar-user-avatar {
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--htsm-r-pill);
    background: var(--htsm-primary);
    color: var(--htsm-primary-ink);
    font-size: 16px;
    font-weight: 600;
  }
  .sidebar-user-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .sidebar-user-name {
    font-size: 12.5px;
    font-weight: 500;
    line-height: 1.3;
    color: var(--htsm-sidebar-active-ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sidebar-user-role {
    font-size: 11px;
    line-height: 1.3;
    color: var(--htsm-sidebar-ink-2);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ---------- Lucide 图标尺寸 ---------- */
  .htsm-icon { width: 16px; height: 16px; flex-shrink: 0; }
  .sidebar-brand-logo .htsm-icon { width: 18px; height: 18px; }
  .sidebar-nav-item .htsm-icon { width: 18px; height: 18px; }

  /* ---------- 顶栏 ---------- */
  .topbar-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .topbar-actions { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .topbar-search {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 220px;
    height: 36px;
    padding: 0 12px;
    border-radius: var(--htsm-r-md);
    background: var(--htsm-surface-2);
    color: var(--htsm-ink-3);
  }
  .topbar-search input {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    background: transparent;
    font-family: inherit;
    font-size: 13px;
    color: var(--htsm-ink);
  }
  .topbar-search input::placeholder { color: var(--htsm-ink-3); }
  .topbar-icon-btn {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border: none;
    border-radius: var(--htsm-r-md);
    background: transparent;
    color: var(--htsm-ink-2);
    cursor: pointer;
    transition: background-color .15s, color .15s;
  }
  .topbar-icon-btn:hover { background: var(--htsm-surface-2); color: var(--htsm-ink); }
  .topbar-badge {
    position: absolute;
    top: 6px;
    right: 7px;
    width: 7px;
    height: 7px;
    border-radius: var(--htsm-r-pill);
    background: var(--htsm-state-error);
    border: 1.5px solid var(--htsm-surface);
  }
  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border: none;
    border-radius: var(--htsm-r-md);
    background: var(--htsm-primary);
    color: var(--htsm-primary-ink);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background-color .15s;
  }
  .btn-primary:hover { background: var(--htsm-primary-hover); }

  /* ---------- 响应式：icon-only 折叠 ---------- */
  @media (max-width: 768px) {
    .app-sidebar { width: 64px; }
    .sidebar-brand { justify-content: center; padding: 20px 10px 16px; }
    .sidebar-brand-text,
    .sidebar-nav-group-label,
    .sidebar-nav-item > span,
    .sidebar-user-info { display: none; }
    .sidebar-nav { padding: 4px 8px 12px; }
    .sidebar-nav-item { justify-content: center; padding: 10px; }
    .sidebar-user { justify-content: center; padding: 12px 8px; }
    .app-content { padding: 16px; }
  }
</style>

<div class="app-shell">

  <!-- ============ 侧边栏 ============ -->
  <aside class="app-sidebar">

    <!-- 品牌区 -->
    <div class="sidebar-brand">
      <div class="sidebar-brand-logo">
        <i data-lucide="scan-barcode" class="htsm-icon"></i>
      </div>
      <div class="sidebar-brand-text">
        <span class="sidebar-brand-title">产品编码</span>
        <span class="sidebar-brand-sub">管理系统</span>
      </div>
    </div>

    <!-- 导航区 -->
    <nav class="sidebar-nav" aria-label="主导航">
      <div class="sidebar-nav-group-label">主导航</div>

      <a href="#" data-nav-key="products" data-dom-id="nav-products" class="sidebar-nav-item">
        <i data-lucide="package" class="htsm-icon"></i>
        <span class="whitespace-nowrap">产品管理</span>
      </a>

      <a href="#" data-nav-key="search" data-dom-id="nav-search" class="sidebar-nav-item">
        <i data-lucide="search" class="htsm-icon"></i>
        <span class="whitespace-nowrap">高级搜索</span>
      </a>

      <a href="#" data-nav-key="backup" data-dom-id="nav-backup" class="sidebar-nav-item">
        <i data-lucide="database-backup" class="htsm-icon"></i>
        <span class="whitespace-nowrap">数据备份</span>
      </a>
    </nav>

    <!-- 底部用户区 -->
    <div class="sidebar-user">
      <div class="sidebar-user-avatar" aria-hidden="true">张</div>
      <div class="sidebar-user-info">
        <span class="sidebar-user-name">管理员 · 张工</span>
        <span class="sidebar-user-role">系统管理员</span>
      </div>
      <i data-lucide="log-out" class="htsm-icon" style="color: var(--htsm-sidebar-ink-2); cursor: pointer;" aria-hidden="true"></i>
    </div>
  </aside>

  <!-- ============ 主区 ============ -->
  <div class="app-main">

    <!-- 顶栏 -->
    <header class="app-topbar">
      <div class="topbar-title htsm-h2" id="pageTitle"><!-- SLOT: pageTitle --></div>

      <div class="topbar-actions">
        <div class="topbar-search">
          <i data-lucide="search" class="htsm-icon"></i>
          <input type="search" placeholder="搜索产品 / 编码…" aria-label="全局搜索" />
        </div>

        <button type="button" class="topbar-icon-btn" aria-label="通知">
          <i data-lucide="bell" class="htsm-icon"></i>
          <span class="topbar-badge" aria-hidden="true"></span>
        </button>

        <button type="button" class="btn-primary">
          <i data-lucide="plus" class="htsm-icon"></i>
          新建产品
        </button>
      </div>
    </header>

    <!-- 内容区（叶子页面填充） -->
    <main class="app-content" id="main-content"><!-- SLOT: mainContent --></main>
  </div>
</div>
